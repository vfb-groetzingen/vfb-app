<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2a33">
<meta name="description" content="Vereins-App des VfB 04 Grötzingen: Flohmarkt für Sportartikel und Vereinschat.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VfB Grötzingen">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>VfB Grötzingen – Vereins-App</title>
<style>
:root{--ink:#1d2630;--muted:#5b6876;--line:#dfe5ea;--bg:#f5f7f9;--head:#1f2a33;--accent:#2f6b4f;--accent-d:#24543e;--warn:#9a3412;--warn-bg:#fef3c7;--err:#b3261e;--ok-bg:#e6f4ea}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;color:var(--head);padding:18px 20px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;border-bottom:1px solid var(--line)}
.logo{display:block;max-height:110px;max-width:260px;width:auto;height:auto}
header strong{font-size:20px;color:var(--head)}
.slogan{font-size:14px;color:var(--muted);margin-top:2px}
#who{font-size:13px;color:var(--muted);min-height:1em}
nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px}
nav button{background:none;border:0;padding:12px 14px;cursor:pointer;color:var(--muted);font:inherit;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent-d);border-bottom-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #7fb8e6;outline-offset:2px}
main{max-width:900px;width:100%;margin:0 auto;padding:20px;flex:1}
h2{font-size:20px;margin:4px 0 12px;color:var(--head)}
h3{margin:0 0 8px;color:var(--head)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{flex:1;min-width:180px}
.field.full{flex-basis:100%}
label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #c5ced6;border-radius:8px;font:inherit;background:#fff}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.primary:hover{background:var(--accent-d)}
button.secondary{background:#fff;color:var(--accent-d);border:1px solid var(--accent);border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.link{background:none;border:0;color:var(--accent-d);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;padding:0}
.notice{background:#e8f1fb;color:var(--head);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
.warn{background:#fdecea;color:var(--err)}
.muted{color:var(--muted);font-size:13px}
.match{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf1f4}
.match.next{border-left:4px solid var(--accent);padding-left:10px}
.match.own{font-weight:600}
.match .md{color:var(--muted);font-size:13px}
.score{font-weight:700;font-variant-numeric:tabular-nums;min-width:50px;text-align:center}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;border-bottom:1px solid #edf1f4;text-align:left;font-size:14px}
th{font-size:13px;color:var(--head)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.own td{background:var(--ok-bg);font-weight:600}
.msgs{height:360px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.msg{margin-bottom:12px}
.msg b{font-size:14px;color:var(--head)}
.msg span{color:var(--muted);font-size:12px;margin-left:6px}
.msg p{margin:2px 0 0;white-space:pre-wrap}
.item{display:flex;gap:12px;border-bottom:1px solid #edf1f4;padding:12px 0}
.item h3{font-size:16px;margin-bottom:4px}
.thumb{width:96px;height:96px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#eef2f5}
.price{font-weight:700;color:var(--accent-d);margin-left:6px}
.tag{display:inline-block;background:#e8edf1;color:var(--head);font-size:12px;border-radius:99px;padding:2px 8px;margin:0 6px 4px 0}
.warn-tag{background:var(--warn-bg);color:var(--warn)}
.sold-tag{background:#e5e7eb;color:#374151}
.field.check{flex:0 0 auto;min-width:0;align-self:center}
.field.check label{font-weight:400;display:flex;gap:6px;align-items:center;margin:0}
.filter{padding-bottom:6px}
.item:last-child{border-bottom:0}
footer{text-align:center;font-size:13px;color:var(--muted);padding:16px;border-top:1px solid var(--line);background:#fff}
footer a{color:var(--accent-d)}
@media (max-width:560px){.match{grid-template-columns:70px 1fr auto}.thumb{width:72px;height:72px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<header>
  <img class="logo" src="logo.png" alt="Logo VfB Grötzingen" onerror="this.remove()">
  <div><strong>VfB Grötzingen</strong><div class="slogan">Hier ist Sport daheim.</div></div>
  <div id="who"></div>
</header>
<nav role="tablist" id="tabs"></nav>
<main id="main"><p class="muted">Lade …</p></main>
<footer>VfB 04 Grötzingen e.V. · <a href="https://www.vfb-groetzingen.de">www.vfb-groetzingen.de</a> · <a href="#" onclick="go('impressum');return false">Impressum</a> · <a href="#" onclick="go('datenschutz');return false">Datenschutz</a></footer>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
